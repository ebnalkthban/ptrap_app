name: Build PH PRT APP APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Set up Java (Required for Android Build)
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter (Flet backend requires Flutter)
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.x' # إصدار مستقر ومتوافق جداً مع فليت 0.21

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build Android APK via Flet
      run: |
        flet build apk
        
    - name: Upload APK Artifact (To Download It)
      uses: actions/upload-artifact@v3
      with:
        name: ph-prt-app-release-apk
        path: build/apk/*.apk
