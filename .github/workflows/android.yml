name: Build PTRAP APK
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            python3-dev \
            python3-pip \
            python3-setuptools \
            libffi-dev \
            libssl-dev \
            libsqlite3-dev \
            openjdk-17-jdk \
            zip \
            unzip \
            zlib1g-dev \
            autoconf \
            libtool \
            pkg-config \
            libncurses-dev \
            cmake
          # تثبيت مكتبات بايثون للمستخدم وإضافتها للمسار
          pip3 install --user --upgrade pip
          pip3 install --user "cython<3.0" wheel buildozer
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Build with Buildozer
        run: |
          # قبول التراخيص وبناء التطبيق
          yes | buildozer -v android debug
        env:
          ACCEPT_SDK_LICENSE: "y"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PTRAP-Android-APK
          path: bin/*.apk
